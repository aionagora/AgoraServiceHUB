# ────────────────────────────────────────────────────────────────────
# nginx.conf — AgoraHub360 ERP Web (Blazor WebAssembly)
# Sirve los archivos estáticos compilados con caché y compresión.
# ────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compresión gzip para WASM y recursos estáticos
    gzip on;
    gzip_types  text/plain text/css application/json application/javascript
                application/wasm application/octet-stream
                image/svg+xml image/x-icon;
    gzip_min_length 1000;
    gzip_vary on;

    # Seguridad básica
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # ── Health check para Docker ──
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # ── Configuración de Blazor WASM ──
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # ── Archivos compilados con caché larga ──
        location /_framework/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /css/ {
            expires 7d;
            add_header Cache-Control "public";
        }

        location /js/ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── Service worker — sin caché ──
        location /service-worker.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /service-worker.js.map {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
