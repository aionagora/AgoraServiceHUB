<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgoraHub360 ERP</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="AgoraHub360.ERP.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">&#10005;</a>
    </div>

    <script>
        // ── accountDropdown: click-outside helper ─────────────────────────────
        window.accountDropdown = {
            _handlers: new Map(),

            registerClickOutside(containerEl, dotnetObj, callbackMethod) {
                // Eliminar listener previo si ya existía para este contenedor
                if (this._handlers.has(containerEl)) {
                    document.removeEventListener('click', this._handlers.get(containerEl));
                    this._handlers.delete(containerEl);
                }

                const handler = (e) => {
                    if (containerEl && !containerEl.contains(e.target)) {
                        dotnetObj.invokeMethodAsync(callbackMethod);
                    }
                };

                document.addEventListener('click', handler);
                this._handlers.set(containerEl, handler);
            },

            unregister(containerEl) {
                if (this._handlers.has(containerEl)) {
                    document.removeEventListener('click', this._handlers.get(containerEl));
                    this._handlers.delete(containerEl);
                }
            }
        };
    </script>

    <script src="js/file-download.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
